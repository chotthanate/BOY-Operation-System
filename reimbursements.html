<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5faf7"><title>รอเบิกค่าใช้จ่าย | BOY Operation</title>
<style>
:root{--ink:#17352e;--muted:#70817a;--line:#dfe9e4;--green:#0b876b;--soft:#e8f6f0;--orange:#ef6c4d;--orange-soft:#fff0e9;--bg:#f5faf7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f1faf6,#fffaf4);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans Thai",sans-serif}button{font:inherit}.wrap{width:min(100%,900px);margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 34px}.top{display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:22px}.top h1{margin:0;font-size:24px}.top p{margin:3px 0 0;color:var(--muted);font-size:12px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.stat{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:5px;font-size:22px}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.filters button{white-space:nowrap;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted)}.filters button.active{color:var(--green);background:var(--soft);border-color:#b8ddce}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}.item input{width:21px;height:21px;accent-color:var(--green)}.item strong,.item span{display:block}.item .meta{margin-top:4px;color:var(--muted);font-size:12px}.item .desc{margin-top:7px;font-size:13px}.amount{font-size:17px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:#fff}.bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 10px 30px rgba(20,55,44,.13);backdrop-filter:blur(10px)}.select-all{padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#fff}.settle{flex:1;min-height:48px;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:850}.settle:disabled{opacity:.45}.error{color:#c84747}@media(max-width:450px){.top h1{font-size:21px}.item{grid-template-columns:auto 1fr}.amount{grid-column:2;text-align:left}.summary{margin-top:14px}}
</style><style>.item{display:block;padding:0;overflow:hidden}.bill-heading{display:flex;align-items:flex-start;gap:12px;padding:15px;border-bottom:1px solid var(--line);background:#fbfdfb;cursor:pointer}.bill-heading input{flex:none;margin:3px 0 0}.bill-lines{margin:0;padding:5px 16px 5px 43px}.bill-lines li{padding:12px 0;border-bottom:1px solid var(--line)}.bill-lines li:last-child{border-bottom:0}.bill-lines li::marker{font-weight:700;color:var(--green)}.bill-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:start}.line-copy{min-width:0;overflow-wrap:anywhere}.line-amount{white-space:nowrap;font-size:15px}.line-detail{color:var(--muted);font-size:12px;margin-top:4px}.bill-total{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;background:var(--soft);font-size:14px}.bill-note{margin:0;padding:8px 16px;color:var(--muted);font-size:13px}.stat #count{font-size:18px;line-height:1.5}</style>
<style id="boyAuthPendingStyle">html{visibility:hidden}</style></head><body><main class="wrap"><header class="top"><button class="back" onclick="location.href='index.html'">‹</button><div><h1>รอเบิกค่าใช้จ่าย</h1><p>รวมรายการที่พนักงานสำรองจ่ายจากทุกสาขา</p></div><button id="reloadBtn" class="back" onclick="load()" aria-label="โหลดรายการใหม่">↻</button></header><section class="summary"><div class="stat"><span>ยอดรอเบิก</span><strong id="total">—</strong></div><div class="stat"><span>รายการรอเบิก</span><strong id="count">—</strong></div></section><nav class="filters" id="filters"><button class="active" data-branch="">ทั้งหมด</button></nav><section class="list" id="list"><div class="empty">กำลังโหลดรายการ...</div></section><div class="bar"><button class="select-all" onclick="toggleAll()">เลือกทั้งหมด</button><button class="settle" id="settleBtn" onclick="settleSelected()" disabled>เคลียร์รายการที่เลือก</button></div></main>
<script>
let rows=[],filter='',central,summary={};document.addEventListener('DOMContentLoaded',load);
async function api(action,payload={}){const config=window.BOY_CENTRAL_CONFIG;central||=window.supabase.createClient(config.url,config.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,...(window.BOY_SESSION_STORAGE?{storage:window.BOY_SESSION_STORAGE.storage}:{})}});const {data:{session}}=await central.auth.getSession();if(!session)throw new Error('กรุณาเข้าสู่ระบบออนไลน์ก่อนดูรายการรอเบิก');const {data,error}=await central.schema('boy_central').rpc(action==='reimbursements'?'get_reimbursements':'settle_reimbursements',action==='reimbursements'?{}:{payload:{payment_ids:payload.ids}});if(error)throw error;return data}
async function bounded(request){let timer;try{return await Promise.race([request,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('โหลดข้อมูลนานเกินไป กรุณากดโหลดใหม่')),12000);})]);}finally{clearTimeout(timer);}}
async function load(){document.getElementById('reloadBtn').disabled=true;list.innerHTML='<div class="empty">กำลังโหลดรายการจากฐานกลาง…</div>';try{const d=await bounded(api('reimbursements'));summary=d;rows=d.rows||[];renderFilters();render()}catch(e){list.innerHTML='<div class="empty error">'+esc(e.message)+'<br><a href="burger.html?online=1&amp;next=reimbursements.html">เข้าสู่ระบบออนไลน์</a></div>'}finally{document.getElementById('reloadBtn').disabled=false;}}
function renderFilters(){const branches=[...new Map(rows.map(r=>[r.branch_id,r.branch_name])).entries()];if(filter&&!branches.some(([id])=>id===filter))filter='';filters.innerHTML=`<button class="${filter?'':'active'}" data-branch="">ทั้งหมด</button>`+branches.map(([id,name])=>`<button class="${filter===id?'active':''}" data-branch="${esc(id)}">${esc(name)}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.branch;filters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()})}
function visible(){return rows.filter(r=>!filter||r.branch_id===filter)}
function billLines(row){return Array.isArray(row.lines)?row.lines:(row.descriptions||[]).map(description=>({description,amount:null}));}
function renderBill(row){
 const lines=billLines(row);
 return `<article class="item"><label class="bill-heading"><input type="checkbox" value="${esc(row.id)}" ${row.can_settle?'':'disabled'} onchange="updateButton()" aria-label="เลือกทั้งบิลของ ${esc(row.branch_name)} วันที่ ${dateText(row.transaction_date)}"><span><strong>${esc(row.branch_name)}</strong><span class="meta">${dateText(row.transaction_date)} · ${lines.length} รายการ</span></span></label><ol class="bill-lines">${lines.map(line=>`<li><div class="bill-line"><div class="line-copy">${esc(line.description||'ค่าใช้จ่าย')}${line.supplier?`<div class="line-detail">ซื้อจาก ${esc(line.supplier)}</div>`:''}${line.note?`<div class="line-detail">${esc(line.note)}</div>`:''}</div><strong class="line-amount">${line.amount==null?'—':'฿'+money(line.amount)}</strong></div></li>`).join('')}</ol>${row.note?`<p class="bill-note">${esc(row.note)}</p>`:''}<footer class="bill-total"><span>ยอดรอเบิกทั้งบิล</span><strong>฿${money(row.total_amount)}</strong></footer></article>`;
}
function render(){
 const v=visible(),lineCount=filter?v.reduce((sum,r)=>sum+billLines(r).length,0):(summary.line_count??v.reduce((sum,r)=>sum+billLines(r).length,0)),bills=filter?v.length:summary.count;
 total.textContent=money(filter?v.reduce((s,r)=>s+(+r.total_amount||0),0):summary.total);
 count.textContent=lineCount+' รายการ · '+bills+' บิล';
 list.innerHTML=v.map(renderBill).join('')||'<div class="empty">ไม่มีรายการรอเบิก</div>';
 if(summary.count>rows.length)list.insertAdjacentHTML('beforeend','<p>แสดงรายละเอียดล่าสุด 500 บิล โปรดเคลียร์รายการแล้วโหลดใหม่</p>');
 updateButton();
}
function selected(){return [...document.querySelectorAll('.item input:checked:not(:disabled)')].map(x=>x.value)}function updateButton(){const n=selected().length;settleBtn.disabled=!n||n>100;settleBtn.textContent=n>100?'เลือกได้ครั้งละไม่เกิน 100 บิล':n?'เคลียร์ '+n+' บิล':'เคลียร์บิลที่เลือก'}function toggleAll(){const boxes=[...document.querySelectorAll('.item input:not(:disabled)')].slice(0,100);const all=boxes.length&&boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=!all);updateButton()}
async function settleSelected(){const ids=selected();if(!ids.length||!confirm('ยืนยันว่าได้รับเงินคืนครบทั้ง '+ids.length+' บิลแล้ว?'))return;settleBtn.disabled=true;try{await api('reimbursementsSettle',{ids});await load()}catch(e){alert(e.message);updateButton()}}
function money(v){return new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(+v||0)}function dateText(v){return new Date(v+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/boy-central-config.js"></script><script src="assets/js/boy-session-storage.js?v=20261102-3"></script><script src="assets/js/boy-local-access.js?v=20260922-1"></script><script src="assets/js/boy-auth-guard.js"></script></body></html>

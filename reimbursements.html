<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5faf7"><title>รอเบิกค่าใช้จ่าย | BOY Operation</title>
<style>
:root{--ink:#17352e;--muted:#70817a;--line:#dfe9e4;--green:#0b876b;--soft:#e8f6f0;--orange:#ef6c4d;--orange-soft:#fff0e9;--bg:#f5faf7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f1faf6,#fffaf4);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans Thai",sans-serif}button{font:inherit}.wrap{width:min(100%,900px);margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 34px}.top{display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:22px}.top h1{margin:0;font-size:24px}.top p{margin:3px 0 0;color:var(--muted);font-size:12px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.stat{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:5px;font-size:22px}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.filters button{white-space:nowrap;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted)}.filters button.active{color:var(--green);background:var(--soft);border-color:#b8ddce}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}.item input{width:21px;height:21px;accent-color:var(--green)}.item strong,.item span{display:block}.item .meta{margin-top:4px;color:var(--muted);font-size:12px}.item .desc{margin-top:7px;font-size:13px}.amount{font-size:17px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:#fff}.bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 10px 30px rgba(20,55,44,.13);backdrop-filter:blur(10px)}.select-all{padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#fff}.settle{flex:1;min-height:48px;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:850}.settle:disabled{opacity:.45}.error{color:#c84747}@media(max-width:450px){.top h1{font-size:21px}.item{grid-template-columns:auto 1fr}.amount{grid-column:2;text-align:left}.summary{margin-top:14px}}
</style><style id="boyAuthPendingStyle">html{visibility:hidden}</style></head><body><main class="wrap"><header class="top"><button class="back" onclick="location.href='index.html'">‹</button><div><h1>รอเบิกค่าใช้จ่าย</h1><p>รวมรายการที่พนักงานสำรองจ่ายจากทุกสาขา</p></div></header><section class="summary"><div class="stat"><span>ยอดรอเบิก</span><strong id="total">—</strong></div><div class="stat"><span>จำนวนรายการ</span><strong id="count">—</strong></div></section><nav class="filters" id="filters"><button class="active" data-branch="">ทั้งหมด</button></nav><section class="list" id="list"><div class="empty">กำลังโหลดรายการ...</div></section><div class="bar"><button class="select-all" onclick="toggleAll()">เลือกทั้งหมด</button><button class="settle" id="settleBtn" onclick="settleSelected()" disabled>เคลียร์รายการที่เลือก</button></div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbzgShPP4BpUUvDSs53esvJLru3CFAe1tM4LqdXE9rUzENbBNBFY3lPPqjVw6fnhgEKmGw/exec';let rows=[],filter='';document.addEventListener('DOMContentLoaded',load);
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},payload))});const j=await r.json();if(j.status!=='success')throw new Error(j.message||'ทำรายการไม่สำเร็จ');return j}
async function load(){try{const d=await api('reimbursements');rows=d.rows||[];renderFilters();render()}catch(e){list.innerHTML='<div class="empty error">'+esc(e.message)+'</div>'}}
function renderFilters(){const branches=[...new Map(rows.map(r=>[r.branch_id,r.branch_name])).entries()];filters.innerHTML='<button class="active" data-branch="">ทั้งหมด</button>'+branches.map(([id,name])=>`<button data-branch="${esc(id)}">${esc(name)}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.branch;filters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()})}
function visible(){return rows.filter(r=>!filter||r.branch_id===filter)}function render(){const v=visible();total.textContent=money(v.reduce((s,r)=>s+(+r.total_amount||0),0));count.textContent=v.length+' รายการ';list.innerHTML=v.map(r=>`<label class="item"><input type="checkbox" value="${esc(r.id)}" onchange="updateButton()"><span><strong>${esc((r.descriptions||[]).join(', ')||'ค่าใช้จ่าย')}</strong><span class="meta">${esc(r.branch_name)} · ${dateText(r.transaction_date)}</span>${r.note?`<span class="desc">${esc(r.note)}</span>`:''}</span><strong class="amount">${money(r.total_amount)}</strong></label>`).join('')||'<div class="empty">ไม่มีรายการรอเบิก</div>';updateButton()}
function selected(){return [...document.querySelectorAll('.item input:checked')].map(x=>x.value)}function updateButton(){const n=selected().length;settleBtn.disabled=!n;settleBtn.textContent=n?'เคลียร์ '+n+' รายการ':'เคลียร์รายการที่เลือก'}function toggleAll(){const boxes=[...document.querySelectorAll('.item input')];const all=boxes.length&&boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=!all);updateButton()}
async function settleSelected(){const ids=selected();if(!ids.length||!confirm('ยืนยันว่าได้รับเงินคืนสำหรับ '+ids.length+' รายการแล้ว?'))return;settleBtn.disabled=true;try{await api('reimbursementsSettle',{ids});await load()}catch(e){alert(e.message);updateButton()}}
function money(v){return new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(+v||0)}function dateText(v){return new Date(v+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/boy-central-config.js"></script><script src="assets/js/boy-local-access.js?v=20260922-1"></script><script src="assets/js/boy-auth-guard.js"></script></body></html>

    function syncCategorySelects(selectedSubcategory=''){const main=$('#form [name="category_id"]'),sub=$('#form [name="subcategory_id"]'),ref=referenceCache.categories;if(!main||!sub||!ref)return;const wanted=selectedSubcategory||sub.value;const rows=ref.rows.filter(active).filter(r=>r['ชื่อประเภทย่อย']&&(!main.value||String(r.category_id)===String(main.value)));sub.innerHTML='<option value="">— เลือกจากชื่อประเภทย่อย —</option>'+rows.map(r=>{const id=r.subcategory_id||'',label=r['ชื่อประเภทย่อย'];return `<option value="${esc(id)}" ${String(id)===String(wanted)?'selected':''}>${esc(label)}</option>`}).join('');main.onchange=()=>syncCategorySelects('')}

    function formatValue(v,type){if(!v)return'';if(type==='date'){const text=String(v).trim();const thai=text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(thai){const year=Number(thai[3])>2400?Number(thai[3])-543:Number(thai[3]);return `${year}-${thai[2].padStart(2,'0')}-${thai[1].padStart(2,'0')}`}const d=new Date(v);return isNaN(d)?text.slice(0,10):d.toISOString().slice(0,10)}if(type==='time'){const text=String(v);const match=text.match(/(?:T|\s)(\d{2}:\d{2})/);return match?match[1]:text.slice(0,5)}return v}
    function closeEditor(){$('#editor').classList.add('hidden');editing=null}
    async function save(e){e.preventDefault();const values={};new FormData(e.target).forEach((v,k)=>{if(k!=='_store_scope')values[k]=v});catalog.headers.filter(h=>h&&!((catalog.readonlyHeaders||[]).includes(h))&&isBoolHeader(h)).forEach(h=>values[h]=Boolean(e.target.elements[h]?.checked));const storeTypes=[...e.target.querySelectorAll('[name="_store_scope"]:checked')].map(input=>input.value);const branchIds=storeTypes.flatMap(branchIdsForStoreType);document.body.classList.add('loading');setStatus('กำลังบันทึก…');try{catalog=isSheetEntity()?await api('sheetSave',{sheetName:currentSheetName(),rowNumber:editing?.__rowNumber||'',values,actor:actor(),expectedVersion:editing?.__version||''}):await api('masterSave',{entity:current,rowNumber:editing?.__rowNumber||'',values,branchIds:(current==='items'||current==='expenseItems')?branchIds:undefined,actor:actor(),expectedVersion:editing?.__version||''});Object.assign(referenceCache,catalog.references||{});closeEditor();renderCatalogFilters();renderRows();setStatus('บันทึกลง BOY Master แล้ว')}catch(err){alert('บันทึกไม่สำเร็จ: '+err.message);setStatus('บันทึกไม่สำเร็จ')}finally{document.body.classList.remove('loading')}}
    async function setActive(rowNumber,next){const row=(catalog.rows||[]).find(item=>String(item.__rowNumber)===String(rowNumber));try{if(!next){setStatus('กำลังตรวจผลกระทบ…');const impact=await api('masterImpact',{sheetName:currentSheetName(),rowNumber});const detail=impact.usages?.length?`\nพบการอ้างอิง ${impact.usages.length} จุด เช่น ${impact.usages.slice(0,4).map(item=>item.sheetName).join(', ')}`:'';if(!confirm(`ปิดใช้งานรายการนี้ใช่ไหม?${detail}`)){setStatus('พร้อมใช้งาน');return}}else if(!confirm('เปิดใช้งานรายการนี้ใช่ไหม?'))return;document.body.classList.add('loading');catalog=isSheetEntity()?await api('sheetSetActive',{sheetName:currentSheetName(),rowNumber,active:next,actor:actor(),expectedVersion:row?.__version||''}):await api('masterSetActive',{entity:current,rowNumber,active:next,actor:actor(),expectedVersion:row?.__version||''});renderRows();setStatus('อัปเดตสถานะแล้ว')}catch(e){alert(e.message);setStatus('ทำรายการไม่สำเร็จ')}finally{document.body.classList.remove('loading')}}
    function csvCell(value){const text=String(value??'');return /[",\n\r]/.test(text)?`"${text.replace(/"/g,'""')}"`:text}
    function exportCsv(){const headers=(catalog.headers||[]).filter(Boolean),rows=filteredRows(),csv='\ufeff'+[headers.map(csvCell).join(','),...rows.map(row=>headers.map(header=>csvCell(row[header])).join(','))].join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`${currentSheetName()}-${new Date().toISOString().slice(0,10)}.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const char=text[i],next=text[i+1];if(char==='"'&&quoted&&next==='"'){cell+='"';i++}else if(char==='"'){quoted=!quoted}else if(char===','&&!quoted){row.push(cell);cell=''}else if((char==='\n'||char==='\r')&&!quoted){if(char==='\r'&&next==='\n')i++;row.push(cell);if(row.some(value=>value!==''))rows.push(row);row=[];cell=''}else cell+=char}row.push(cell);if(row.some(value=>value!==''))rows.push(row);return rows}
    async function prepareImport(file){const matrix=parseCsv((await file.text()).replace(/^\ufeff/,''));if(matrix.length<2)throw new Error('ไฟล์ไม่มีรายการข้อมูล');const headers=matrix[0].map(value=>value.trim()),valid=headers.filter(header=>(catalog.headers||[]).includes(header));if(!valid.length)throw new Error('หัวคอลัมน์ไม่ตรงกับหน้านี้');pendingImport=matrix.slice(1).map(values=>Object.fromEntries(headers.map((header,index)=>[header,values[index]??'']).filter(([header])=>valid.includes(header)))).slice(0,300);$('#importSummary').textContent=`พร้อมนำเข้า ${pendingImport.length} รายการ · ตรง ${valid.length} คอลัมน์`;$('#importHead').innerHTML='<tr>'+valid.slice(0,8).map(header=>`<th>${esc(friendlyHeader(header))}</th>`).join('')+'</tr>';$('#importBody').innerHTML=pendingImport.slice(0,10).map(row=>'<tr>'+valid.slice(0,8).map(header=>`<td>${esc(row[header])}</td>`).join('')+'</tr>').join('');$('#importDialog').classList.remove('hidden')}
    async function confirmImport(){if(!pendingImport.length)return;document.body.classList.add('loading');setStatus('กำลังนำเข้า…');try{catalog=await api('sheetBulkSave',{sheetName:currentSheetName(),rows:pendingImport,actor:actor()});const result=catalog.imported||{};pendingImport=[];$('#importDialog').classList.add('hidden');renderRows();setStatus(`นำเข้าแล้ว เพิ่ม ${result.added||0} แก้ไข ${result.updated||0}`)}catch(error){alert('นำเข้าไม่สำเร็จ: '+error.message);setStatus('นำเข้าไม่สำเร็จ')}finally{document.body.classList.remove('loading')}}
    async function openHistory(){const dialog=$('#historyDialog'),list=$('#historyList');dialog.classList.remove('hidden');list.innerHTML='<div class="empty">กำลังโหลด…</div>';try{const data=await api('masterHistory',{sheetName:currentSheetName(),limit:60});list.innerHTML=data.rows.length?data.rows.map(row=>`<article class="audit-row"><div><strong>${esc(row.action)}${row.record_key?' · '+esc(row.record_key):''}</strong><small>${esc(row.changed_at)} · ${esc(row.actor)}</small></div>${!row.undone_at&&row.action!=='ย้อนกลับ'?`<button class="secondary" data-undo="${esc(row.audit_id)}">ย้อนกลับ</button>`:'<span class="meta">ย้อนแล้ว</span>'}</article>`).join(''):'<div class="empty">ยังไม่มีประวัติแก้ไข</div>';list.querySelectorAll('[data-undo]').forEach(button=>button.onclick=()=>undoAudit(button.dataset.undo))}catch(error){list.innerHTML=`<div class="empty">${esc(error.message)}</div>`}}
    async function undoAudit(auditId){if(!confirm('ย้อนกลับเป็นค่าก่อนแก้ไขใช่ไหม?'))return;try{await api('masterUndo',{auditId,actor:actor()});$('#historyDialog').classList.add('hidden');await load();setStatus('ย้อนกลับข้อมูลแล้ว')}catch(error){alert(error.message)}}
    async function openHealth(){const dialog=$('#healthDialog'),list=$('#healthList');dialog.classList.remove('hidden');list.innerHTML='<div class="empty">กำลังตรวจ…</div>';try{const data=await api('systemHealthCheck');const rows=[{name:'การเชื่อมต่ออินเทอร์เน็ต',ok:navigator.onLine,message:navigator.onLine?'ออนไลน์':'ออฟไลน์'},{name:'Google Sheet และ Apps Script',ok:data.ok,message:data.ok?'พร้อมใช้งาน':'พบตารางที่ต้องตรวจ'},{name:'ข้อมูลกลาง BOY',ok:true,message:`เปิดใช้งาน ${ENTITIES.length} หน้า`}];if(window.supabase&&window.BOY_CENTRAL_CONFIG){const client=window.supabase.createClient(window.BOY_CENTRAL_CONFIG.url,window.BOY_CENTRAL_CONFIG.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const session=await client.auth.getSession();if(session.data.session){const devices=await client.schema('boy_central').from('pos_devices').select('device_name,status,last_sync_at,app_version').order('device_name');if(!devices.error)(devices.data||[]).forEach(device=>rows.push({name:device.device_name,ok:device.status==='active',message:`POS ${device.status==='active'?'เชื่อมต่อ':'ยังไม่พร้อม'}${device.last_sync_at?' · ซิงก์ '+new Date(device.last_sync_at).toLocaleString('th-TH'):''}${device.app_version?' · v'+device.app_version:''}`}))}}list.innerHTML=rows.map(row=>`<article class="health-row"><div><strong>${esc(row.name)}</strong><small>${esc(row.message)}</small></div><span class="${row.ok?'health-ok':'health-bad'}">${row.ok?'พร้อม':'ตรวจสอบ'}</span></article>`).join('')+data.masterTables.filter(item=>!item.ok).map(item=>`<article class="health-row"><div><strong>${esc(item.name)}</strong><small>${esc(item.message)}</small></div><span class="health-bad">ตรวจสอบ</span></article>`).join('')}catch(error){list.innerHTML=`<div class="empty">ตรวจไม่สำเร็จ<br>${esc(error.message)}</div>`}}
    $('#search').oninput=()=>{currentPage=1;renderRows()};$('#entitySearch').oninput=renderEntities;$('#storeFilter').onchange=()=>{currentPage=1;renderRows()};$('#dataTypeFilter').onchange=()=>{currentPage=1;renderRows()};$('#mainCategoryFilter').onchange=()=>{currentPage=1;renderCategoryFilterOptions();renderRows()};$('#subCategoryFilter').onchange=()=>{currentPage=1;renderRows()};$('#prevPage').onclick=()=>{currentPage--;renderRows();scrollTo({top:0,behavior:'smooth'})};$('#nextPage').onclick=()=>{currentPage++;renderRows();scrollTo({top:0,behavior:'smooth'})};$('#add').onclick=()=>openEditor(null);$('#close').onclick=closeEditor;$('#cancel').onclick=closeEditor;$('#editor').onclick=e=>{if(e.target===$('#editor'))closeEditor()};$('#form').onsubmit=save;$('#exportButton').onclick=exportCsv;$('#importButton').onclick=()=>$('#importFile').click();$('#importFile').onchange=event=>{const file=event.target.files[0];event.target.value='';if(file)prepareImport(file).catch(error=>alert(error.message))};$('#confirmImport').onclick=confirmImport;$('#historyButton').onclick=openHistory;$('#healthButton').onclick=openHealth;document.querySelectorAll('[data-close-dialog]').forEach(button=>button.onclick=()=>$('#'+button.dataset.closeDialog).classList.add('hidden'));document.querySelectorAll('.tool-dialog').forEach(dialog=>dialog.onclick=event=>{if(event.target===dialog)dialog.classList.add('hidden')});document.querySelectorAll('[data-profile-tab]').forEach(b=>b.onclick=()=>showProfileTab(b.dataset.profileTab));if(!ENTITIES.some(item=>item[0]===current))current='employees';let started=false;function startMasterData(){if(started)return;started=true;renderEntities();load()}window.addEventListener('boy-auth-ready',startMasterData);if(window.BOY_AUTH_CONTEXT)startMasterData();

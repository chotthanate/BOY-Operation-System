  <style>
    :root{--ink:#18352e;--muted:#6d7c77;--green:#108a6d;--green2:#0b735b;--soft:#eaf6f1;--line:#dce7e2;--paper:#fff;--danger:#bd463c;--bg:#f4f8f6}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{max-width:1120px;margin:auto;padding:env(safe-area-inset-top) 18px calc(34px + env(safe-area-inset-bottom))}.topbar{position:sticky;top:0;z-index:10;background:rgba(244,248,246,.94);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.back{border:0;background:var(--paper);border-radius:14px;padding:11px 14px;color:var(--ink);font-weight:800}.title small{display:block;color:var(--green);font-size:.72rem;font-weight:900;letter-spacing:.08em}.title h1{font-size:1.28rem;margin:2px 0}.status{font-size:.78rem;color:var(--muted)}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;padding-top:18px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 12px 30px rgba(24,53,46,.05)}.entity-list{display:grid;gap:7px}.entity{border:0;border-radius:13px;background:transparent;text-align:left;padding:12px;color:var(--ink);font-weight:750}.entity.active{background:var(--soft);color:var(--green2)}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:12px}.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fbfdfc}.primary,.secondary,.danger{border:0;border-radius:14px;padding:12px 15px;font-weight:850}.primary{background:var(--green);color:#fff}.secondary{background:var(--soft);color:var(--green2)}.danger{background:#fff0ee;color:var(--danger)}.rows{display:grid;gap:9px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:15px}.row.inactive{opacity:.58}.row strong{display:block}.meta{font-size:.76rem;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-actions{display:flex;gap:6px}.row-actions button{padding:8px 10px;border-radius:10px}.empty{text-align:center;color:var(--muted);padding:34px 10px}.sheet{position:fixed;inset:0;z-index:30;background:rgba(12,30,25,.42);display:flex;align-items:flex-end;justify-content:center;padding-top:30px}.sheet.hidden{display:none}.dialog{background:var(--paper);width:min(760px,100%);max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px max(18px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));box-shadow:0 -20px 70px rgba(0,0,0,.16)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.dialog-head h2{margin:0}.close{border:0;width:42px;height:42px;border-radius:50%;background:var(--soft);font-size:1.3rem}.profile-tabs{display:flex;gap:7px;padding:4px;background:#f1f6f4;border-radius:14px;margin-bottom:15px}.profile-tab{flex:1;border:0;border-radius:11px;padding:10px;background:transparent;color:var(--muted);font-weight:850}.profile-tab.active{background:#fff;color:var(--green2);box-shadow:0 3px 12px rgba(24,53,46,.08)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:.78rem;font-weight:800;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff;color:var(--ink)}.field textarea{min-height:78px;resize:vertical}.field.full{grid-column:1/-1}.check{display:flex;align-items:center;gap:9px;min-height:44px;border:1px solid var(--line);border-radius:13px;padding:10px 12px}.check input{width:20px;height:20px}.actions{position:sticky;bottom:0;background:linear-gradient(transparent,#fff 20%);display:flex;justify-content:flex-end;gap:9px;padding-top:24px;margin-top:8px}.history-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}.history-count{padding:13px;border-radius:14px;background:var(--soft);text-align:center}.history-count strong{display:block;font-size:1.2rem;color:var(--green2)}.history-count span{font-size:.75rem;color:var(--muted)}.history-section{margin-top:18px}.history-section h3{margin:0 0 9px;font-size:1rem}.history-list{display:grid;gap:8px}.history-row{padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:#fbfdfc}.history-row strong{display:block}.history-row small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}.loading{pointer-events:none;opacity:.55}@media(max-width:760px){.shell{padding-left:12px;padding-right:12px}.layout{grid-template-columns:1fr}.entity-panel{overflow:auto}.entity-list{display:flex;width:max-content}.entity{white-space:nowrap}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.status{display:none}.row{align-items:start}.row-actions{flex-direction:column}.history-summary{grid-template-columns:1fr 1fr 1fr}.dialog{max-height:96vh}.actions{position:static;background:#fff;padding-top:14px}}
  </style>
  <style>
    .catalog-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:0 0 14px;padding:12px;border-radius:16px;background:#f4f8f6}
    .catalog-filter{display:grid;gap:5px;min-width:0;color:var(--muted);font-size:.72rem;font-weight:850}
    .catalog-filter select{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--ink)}
    .store-scope{margin-top:4px;padding:13px;border:1px solid var(--line);border-radius:15px;background:#fbfdfc}
    .store-scope-title{display:block;margin-bottom:9px;color:var(--muted);font-size:.78rem;font-weight:850}
    .store-scope-options{display:flex;flex-wrap:wrap;gap:8px}
    .store-scope-option{display:flex;align-items:center;gap:7px;min-height:42px;padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:.82rem;font-weight:800}
    .store-scope-option input{width:19px;height:19px;margin:0}
    .store-scope-note{display:block;margin-top:8px;color:var(--muted);font-size:.72rem}
    @media(max-width:760px){.catalog-filters{grid-template-columns:1fr 1fr}.store-scope{grid-column:auto}.store-scope-options{display:grid;grid-template-columns:1fr}}
  </style>

<body>
  <div class="shell">
    <header class="topbar"><button class="back" type="button" onclick="location.href='tawana.html'">‹ ทาวน่า</button><div class="title"><small>BOY MASTER</small><h1 id="pageTitle">ข้อมูลกลาง</h1></div><span class="status" id="status">พร้อมใช้งาน</span></header>
    <main class="layout">
      <aside class="panel entity-panel"><nav class="entity-list" id="entityList"></nav></aside>
      <section class="panel"><div class="toolbar"><input class="search" id="search" type="search" placeholder="ค้นหา" autocomplete="off"><button class="primary" id="add" type="button">+ เพิ่ม</button></div><div class="catalog-filters hidden" id="catalogFilters"><label class="catalog-filter">ประเภทร้าน<select id="storeFilter"></select></label><label class="catalog-filter" id="dataTypeFilterWrap">ชนิดรายการ<select id="dataTypeFilter"></select></label><label class="catalog-filter">ประเภทหลัก<select id="mainCategoryFilter"></select></label><label class="catalog-filter">ประเภทย่อย<select id="subCategoryFilter"></select></label></div><div class="rows" id="rows"><div class="empty">กำลังโหลดข้อมูล…</div></div></section>
    </main>
  </div>
  <div class="sheet hidden" id="editor" role="dialog" aria-modal="true"><section class="dialog"><div class="dialog-head"><div><small id="editorCode"></small><h2 id="editorTitle">เพิ่มข้อมูล</h2></div><button class="close" id="close" type="button" aria-label="ปิด">×</button></div><div class="profile-tabs hidden" id="employeeTabs"><button class="profile-tab active" data-profile-tab="data" type="button">ข้อมูลพนักงาน</button><button class="profile-tab" data-profile-tab="history" type="button">ประวัติ</button></div><div id="employeeDataPanel"><form id="form"><div class="form" id="fields"></div><div class="actions"><button class="secondary" type="button" id="cancel">ยกเลิก</button><button class="primary" type="submit">บันทึกลง BOY Master</button></div></form></div><section class="hidden" id="employeeHistoryPanel"><div id="employeeHistory"><div class="empty">กำลังโหลดประวัติ…</div></div></section></section></div>
  <script>
    const WEB_APP_URL='https://script.google.com/macros/s/AKfycbzgShPP4BpUUvDSs53esvJLru3CFAe1tM4LqdXE9rUzENbBNBFY3lPPqjVw6fnhgEKmGw/exec';
    const ENTITIES=[['employees','พนักงาน'],['items','สินค้าและวัตถุดิบ'],['expenseItems','รายการค่าใช้จ่าย'],['units','หน่วย'],['suppliers','ผู้ขาย'],['branches','สาขา'],['categories','หมวดหมู่'],['itemUnits','หน่วยสินค้า'],['itemSuppliers','ผู้ขายสินค้า'],['branchItems','สินค้าประจำสาขา']];
    const STORE_TYPES=[['water','ร้านน้ำ'],['grill','ร้านเนื้อย่าง'],['burger','ร้านเบอร์เกอร์']];
    const queryParams=new URLSearchParams(location.search);let current=queryParams.get('entity')||'employees',catalog={headers:[],rows:[],required:[]},editing=null,referenceCache={},requestedEmployee=queryParams.get('employee')||'';
    const $=s=>document.querySelector(s); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(action,data={}){const res=await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});const json=await res.json();if(json.status==='error')throw new Error(json.message||'ทำรายการไม่สำเร็จ');return json}
    function setStatus(t){$('#status').textContent=t}
    function renderEntities(){$('#entityList').innerHTML=ENTITIES.map(([key,label])=>`<button class="entity ${key===current?'active':''}" data-key="${key}">${label}</button>`).join('');document.querySelectorAll('.entity').forEach(b=>b.onclick=()=>{current=b.dataset.key;history.replaceState(null,'','?entity='+current);load()})}
    function primaryText(row){const preferred=['ชื่อเล่น','ชื่อสินค้า','ชื่อรายการค่าใช้จ่าย','ชื่อหน่วย','ชื่อผู้ขาย','ชื่อสาขา','ชื่อประเภทย่อย'];for(const key of preferred)if(row[key])return row[key];return row[catalog.idHeader]||'ไม่ระบุชื่อ'}
    function active(row){return !('เปิดใช้งาน'in row)||![false,'FALSE','false',0,'0'].includes(row['เปิดใช้งาน'])}
    function branchName(id){const ref=referenceCache.branches;const row=ref?.rows?.find(r=>String(r.branch_id)===String(id));return row?.['ชื่อสาขา']||id||'ยังไม่ระบุสาขา'}
    function branchStoreType(row){const text=((row?.['รหัสสาขา']||'')+' '+(row?.['ชื่อสาขา']||'')).toLowerCase();if(/burger|เบอร์เกอร์/.test(text))return'burger';if(/grill|เนื้อย่าง/.test(text))return'grill';return'water'}
    function branchIdsForStoreType(type){return(referenceCache.branches?.rows||[]).filter(r=>branchStoreType(r)===type).map(r=>String(r.branch_id))}
    function scopedItemId(row){return current==='expenseItems'?String(row.item_id||''):String(row.item_id||row[catalog.idHeader]||'')}
    function itemStoreTypes(row){const itemId=scopedItemId(row);const branchIds=(referenceCache.branchItems?.rows||[]).filter(r=>active(r)&&String(r.item_id)===itemId).map(r=>String(r.branch_id));return STORE_TYPES.filter(([type])=>branchIdsForStoreType(type).some(id=>branchIds.includes(id))).map(([type])=>type)}
    function storeTypeLabel(type){return STORE_TYPES.find(([key])=>key===type)?.[1]||type}
    function categoryInfo(row){const rows=referenceCache.categories?.rows||[];return rows.find(r=>String(r.subcategory_id)===String(row.subcategory_id))||rows.find(r=>String(r.category_id)===String(row.category_id))||{}}
    function dataTypeLabel(value){return({STOCK_ITEM:'สินค้า/วัตถุดิบ',NON_STOCK_ITEM:'รายการไม่เก็บสต็อก',EXPENSE_ITEM:'ค่าใช้จ่าย',SERVICE:'บริการ'})[value]||value||''}
    function renderCatalogFilters(){const enabled=current==='items'||current==='expenseItems';$('#catalogFilters').classList.toggle('hidden',!enabled);if(!enabled)return;const storeValue=$('#storeFilter').value;$('#storeFilter').innerHTML='<option value="">ทุกประเภทร้าน</option>'+STORE_TYPES.map(([key,label])=>`<option value="${key}" ${storeValue===key?'selected':''}>${label}</option>`).join('');const typeValue=$('#dataTypeFilter').value;const types=[...new Set((catalog.rows||[]).map(r=>String(r['ประเภทข้อมูล']||'')).filter(Boolean))];$('#dataTypeFilterWrap').classList.toggle('hidden',current!=='items');$('#dataTypeFilter').innerHTML='<option value="">ทุกชนิดรายการ</option>'+types.map(value=>`<option value="${esc(value)}" ${typeValue===value?'selected':''}>${esc(dataTypeLabel(value))}</option>`).join('');renderCategoryFilterOptions()}
    function renderCategoryFilterOptions(){const rows=(referenceCache.categories?.rows||[]).filter(active);const mainValue=$('#mainCategoryFilter').value,subValue=$('#subCategoryFilter').value;const mains=[],seen=new Set();rows.forEach(r=>{const id=String(r.category_id||'');if(id&&r['ชื่อประเภทหลัก']&&!seen.has(id)){seen.add(id);mains.push(r)}});$('#mainCategoryFilter').innerHTML='<option value="">ทุกประเภทหลัก</option>'+mains.map(r=>`<option value="${esc(r.category_id)}" ${String(r.category_id)===mainValue?'selected':''}>${esc(r['ชื่อประเภทหลัก'])}</option>`).join('');const subs=rows.filter(r=>r['ชื่อประเภทย่อย']&&(!$('#mainCategoryFilter').value||String(r.category_id)===$('#mainCategoryFilter').value));$('#subCategoryFilter').innerHTML='<option value="">ทุกประเภทย่อย</option>'+subs.map(r=>`<option value="${esc(r.subcategory_id)}" ${String(r.subcategory_id)===subValue?'selected':''}>${esc(r['ชื่อประเภทย่อย'])}</option>`).join('')}
    function rowMeta(r){if(current==='employees')return [r[catalog.idHeader],branchName(r.branch_id),r['ตำแหน่ง'],r['สถานะการจ้าง'],active(r)?'เปิดใช้งาน':'ปิดใช้งาน'].filter(Boolean).join(' · ');if(current==='items'||current==='expenseItems'){const cat=categoryInfo(r),stores=itemStoreTypes(r).map(storeTypeLabel);return [dataTypeLabel(r['ประเภทข้อมูล']),cat['ชื่อประเภทหลัก'],cat['ชื่อประเภทย่อย'],stores.length?stores.join(', '):'ใช้ร่วมกัน',active(r)?'เปิดใช้งาน':'ปิดใช้งาน'].filter(Boolean).join(' · ')}return [r[catalog.idHeader],active(r)?'เปิดใช้งาน':'ปิดใช้งาน'].filter(Boolean).join(' · ')}
    function renderRows(){const q=$('#search').value.trim().toLowerCase(),store=$('#storeFilter').value,type=$('#dataTypeFilter').value,main=$('#mainCategoryFilter').value,sub=$('#subCategoryFilter').value;const rows=(catalog.rows||[]).filter(r=>{const scopes=itemStoreTypes(r);return(!q||Object.values(r).join(' ').toLowerCase().includes(q))&&(!(current==='items'||current==='expenseItems')||((!store||!scopes.length||scopes.includes(store))&&(current!=='items'||!type||String(r['ประเภทข้อมูล'])===type)&&(!main||String(r.category_id)===main)&&(!sub||String(r.subcategory_id)===sub)))});$('#rows').innerHTML=rows.length?rows.map(r=>`<article class="row ${active(r)?'':'inactive'}"><div><strong>${esc(primaryText(r))}</strong><div class="meta">${esc(rowMeta(r))}</div></div><div class="row-actions"><button class="secondary" data-edit="${r.__rowNumber}">${current==='employees'?'ดู / แก้ไข':'แก้ไข'}</button>${'เปิดใช้งาน'in r?`<button class="danger" data-active="${r.__rowNumber}" data-next="${active(r)?'false':'true'}">${active(r)?'ปิด':'เปิด'}</button>`:''}</div></article>`).join(''):'<div class="empty">ไม่พบข้อมูลตามตัวกรอง</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor((catalog.rows||[]).find(r=>String(r.__rowNumber)===b.dataset.edit)));document.querySelectorAll('[data-active]').forEach(b=>b.onclick=()=>setActive(b.dataset.active,b.dataset.next==='true'))}
    async function load(){renderEntities();$('#rows').innerHTML='<div class="empty">กำลังโหลดข้อมูล…</div>';setStatus('กำลังโหลด…');try{catalog=await api('masterCatalog',{entity:current});Object.assign(referenceCache,catalog.references||{});$('#pageTitle').textContent=catalog.title||'ข้อมูลกลาง';$('#search').placeholder='ค้นหา'+(catalog.title||'ข้อมูล');renderCatalogFilters();renderRows();setStatus('โหลดแล้ว '+catalog.rows.length+' รายการ');if(current==='employees'&&requestedEmployee){const row=(catalog.rows||[]).find(r=>String(r.employee_id)===requestedEmployee);requestedEmployee='';if(row)openEditor(row)}}catch(e){$('#rows').innerHTML='<div class="empty">โหลดไม่สำเร็จ<br>'+esc(e.message)+'</div>';setStatus('เกิดข้อผิดพลาด')}}
    function isBoolHeader(h){return h==='เปิดใช้งาน'||/^(ติดตาม|อนุญาต|เป็น|ใช้|ซื้อได้|เบิกได้|ขายได้)/.test(h)}
    function isLong(h){return /หมายเหตุ|ที่อยู่|รายละเอียด/.test(h)}
    function referenceEntity(h){if(h==='branch_id'||h==='default_branch_id')return'branches';if(h==='item_id')return'items';if(h==='unit_id'||h==='base_unit_id')return'units';if(h==='supplier_id')return'suppliers';if(h==='category_id'||h==='subcategory_id')return'categories';return''}
    async function referenceOptions(h,value){const entity=referenceEntity(h);if(!entity)return'';if(!referenceCache[entity])referenceCache[entity]=await api('masterCatalog',{entity});const ref=referenceCache[entity];if(entity==='categories'){const idHeader=h;const nameHeader=h==='category_id'?'ชื่อประเภทหลัก':'ชื่อประเภทย่อย';const seen=new Set();return '<option value="">— เลือกจากชื่อหมวดหมู่ —</option>'+ref.rows.filter(active).filter(r=>{const id=String(r[idHeader]||''),name=String(r[nameHeader]||'').trim();if(!id||!name||seen.has(id))return false;seen.add(id);return true}).map(r=>{const id=r[idHeader]||'';const label=h==='subcategory_id'?[r[nameHeader],r['ชื่อประเภทหลัก']].filter(Boolean).join(' · '):r[nameHeader];return `<option value="${esc(id)}" ${String(id)===String(value)?'selected':''}>${esc(label)}</option>`}).join('')}return '<option value="">— เลือก —</option>'+ref.rows.filter(active).map(r=>{const id=r[ref.idHeader]||'';return `<option value="${esc(id)}" ${String(id)===String(value)?'selected':''}>${esc(primaryReferenceText(r,entity))} (${esc(id)})</option>`}).join('')}
    function primaryReferenceText(r,entity){const keys={branches:['ชื่อสาขา'],items:['ชื่อสินค้า'],units:['ชื่อหน่วย'],suppliers:['ชื่อผู้ขาย']}[entity]||[];return keys.map(k=>r[k]).find(Boolean)||r[Object.keys(r).find(k=>/_id$/.test(k))]||'รายการ'}
    function storeScopeHtml(row){if(!(current==='items'||current==='expenseItems'))return'';const selected=row?itemStoreTypes(row):[];return `<div class="field full store-scope"><span class="store-scope-title">ใช้กับประเภทร้าน</span><div class="store-scope-options">${STORE_TYPES.map(([key,label])=>`<label class="store-scope-option"><input type="checkbox" name="_store_scope" value="${key}" ${selected.includes(key)?'checked':''}><span>${label}</span></label>`).join('')}</div><small class="store-scope-note">ไม่เลือก หมายถึงรายการใช้ร่วมกันทุกร้าน</small></div>`}
    async function openEditor(row){editing=row||null;const isEmployee=current==='employees';$('#editorTitle').textContent=(row?'แก้ไข':'เพิ่ม')+(catalog.title||'ข้อมูล');$('#editorCode').textContent=row?(row[catalog.idHeader]||''):'ระบบจะสร้างรหัสให้อัตโนมัติ';$('#fields').innerHTML='<div class="empty full">กำลังเตรียมแบบฟอร์ม…</div>';$('#employeeTabs').classList.toggle('hidden',!isEmployee||!row);showProfileTab('data');$('#editor').classList.remove('hidden');const chunks=[];for(const h of catalog.headers){const value=row?.[h]??'';const required=(catalog.required||[]).includes(h);if(h===catalog.idHeader){chunks.push(`<div class="field full"><label>${isEmployee?'รหัสพนักงานในระบบ':'รหัสรายการในระบบ'}</label><input name="${esc(h)}" value="${esc(value)}" readonly placeholder="สร้างอัตโนมัติ"></div>`);continue}if(isBoolHeader(h)){const checked=row?activeValue(value):h==='เปิดใช้งาน';chunks.push(`<label class="check"><input type="checkbox" name="${esc(h)}" ${checked?'checked':''}><span>${esc(h)}</span></label>`);continue}const options=await referenceOptions(h,value);if(options){const friendly=h==='category_id'?'ประเภทหลัก':h==='subcategory_id'?'ประเภทย่อย':h==='branch_id'?'สาขา':h==='default_branch_id'?'สาขาหลัก':h;chunks.push(`<div class="field"><label>${esc(friendly)}${required?' *':''}</label><select name="${esc(h)}" ${required?'required':''}>${options}</select></div>`);continue}if(isLong(h)){chunks.push(`<div class="field full"><label>${esc(h)}</label><textarea name="${esc(h)}" ${required?'required':''}>${esc(value)}</textarea></div>`);continue}const type=/วันที่|วันเดือนปีเกิด/.test(h)?'date':/^เวลา/.test(h)?'time':/จำนวน|ราคา|ค่าแรง|ชั่วโมง|อัตรา|ขั้นต่ำ|จุดสั่ง/.test(h)?'number':'text';chunks.push(`<div class="field"><label>${esc(h)}${required?' *':''}</label><input type="${type}" ${type==='number'?'step="any"':''} name="${esc(h)}" value="${esc(formatValue(value,type))}" ${required?'required':''}></div>`)}chunks.push(storeScopeHtml(row));$('#fields').innerHTML=chunks.join('');syncCategorySelects(row?.subcategory_id||'');if(isEmployee&&row)loadEmployeeHistory(row.employee_id)}
    function showProfileTab(tab){const history=tab==='history';$('#employeeDataPanel').classList.toggle('hidden',history);$('#employeeHistoryPanel').classList.toggle('hidden',!history);document.querySelectorAll('[data-profile-tab]').forEach(b=>b.classList.toggle('active',b.dataset.profileTab===tab))}
    function historyRows(rows,render){return rows.length?`<div class="history-list">${rows.map(render).join('')}</div>`:'<div class="empty">ยังไม่มีประวัติ</div>'}
    async function loadEmployeeHistory(employeeId){const box=$('#employeeHistory');box.innerHTML='<div class="empty">กำลังโหลดประวัติ…</div>';try{const data=await api('employeeHistory',{employeeId});const s=data.summary||{};box.innerHTML=`<div class="history-summary"><div class="history-count"><strong>${s.leaves||0}</strong><span>การลา</span></div><div class="history-count"><strong>${s.payroll||0}</strong><span>เงินเดือน</span></div><div class="history-count"><strong>${s.transactions||0}</strong><span>รายการเกี่ยวข้อง</span></div></div><div class="history-section"><h3>ประวัติการลา</h3>${historyRows(data.leaves||[],r=>`<div class="history-row"><strong>${esc(r.type||'การลา')} · ${esc(r.startDate||'-')}${r.endDate&&r.endDate!==r.startDate?' ถึง '+esc(r.endDate):''}</strong><small>${r.days?'ลา '+r.days+' วัน':''}${r.hours?' · '+r.hours+' ชั่วโมง':''}${r.status?' · '+esc(r.status):''}${r.note?' · '+esc(r.note):''}</small></div>`)}</div><div class="history-section"><h3>ประวัติเงินเดือน</h3>${historyRows(data.payroll||[],r=>`<div class="history-row"><strong>${esc(r.period||'-')} · ${money(r.netPay)} บาท</strong><small>${r.workedDays?'ทำงาน '+r.workedDays+' วัน':''}${r.workedHours?' · '+r.workedHours+' ชั่วโมง':''}${r.status?' · '+esc(r.status):''}${r.paidDate?' · จ่าย '+esc(r.paidDate):''}</small></div>`)}</div><div class="history-section"><h3>รายการที่เกี่ยวข้อง</h3>${historyRows(data.transactions||[],r=>`<div class="history-row"><strong>${esc(r.type||r.mode||'รายการ')} · ${money(r.amount)} บาท</strong><small>${esc(r.date||'-')}${r.status?' · '+esc(r.status):''}${r.note?' · '+esc(r.note):''}</small></div>`)}</div>`}catch(err){box.innerHTML='<div class="empty">โหลดประวัติไม่สำเร็จ<br>'+esc(err.message)+'</div>'}}
    function money(value){return Number(value||0).toLocaleString('th-TH',{maximumFractionDigits:2})}
    function syncCategorySelects(selectedSubcategory=''){const main=$('#form [name="category_id"]'),sub=$('#form [name="subcategory_id"]'),ref=referenceCache.categories;if(!main||!sub||!ref)return;const wanted=selectedSubcategory||sub.value;const rows=ref.rows.filter(active).filter(r=>r['ชื่อประเภทย่อย']&&(!main.value||String(r.category_id)===String(main.value)));sub.innerHTML='<option value="">— เลือกจากชื่อประเภทย่อย —</option>'+rows.map(r=>{const id=r.subcategory_id||'',label=r['ชื่อประเภทย่อย'];return `<option value="${esc(id)}" ${String(id)===String(wanted)?'selected':''}>${esc(label)}</option>`}).join('');main.onchange=()=>syncCategorySelects('')}
    function activeValue(v){return ![false,'FALSE','false',0,'0',''].includes(v)}
    function formatValue(v,type){if(!v)return'';if(type==='date'){const d=new Date(v);return isNaN(d)?String(v).slice(0,10):d.toISOString().slice(0,10)}if(type==='time'){const text=String(v);const match=text.match(/(?:T|\s)(\d{2}:\d{2})/);return match?match[1]:text.slice(0,5)}return v}
    function closeEditor(){$('#editor').classList.add('hidden');editing=null}
    async function save(e){e.preventDefault();const values={};new FormData(e.target).forEach((v,k)=>{if(k!=='_store_scope')values[k]=v});catalog.headers.filter(isBoolHeader).forEach(h=>values[h]=Boolean(e.target.elements[h]?.checked));const storeTypes=[...e.target.querySelectorAll('[name="_store_scope"]:checked')].map(input=>input.value);const branchIds=storeTypes.flatMap(branchIdsForStoreType);document.body.classList.add('loading');setStatus('กำลังบันทึก…');try{catalog=await api('masterSave',{entity:current,rowNumber:editing?.__rowNumber||'',values,branchIds:(current==='items'||current==='expenseItems')?branchIds:undefined});Object.assign(referenceCache,catalog.references||{});closeEditor();renderCatalogFilters();renderRows();setStatus('บันทึกลง BOY Master แล้ว')}catch(err){alert('บันทึกไม่สำเร็จ: '+err.message);setStatus('บันทึกไม่สำเร็จ')}finally{document.body.classList.remove('loading')}}
    async function setActive(rowNumber,next){if(!confirm((next?'เปิด':'ปิด')+'ใช้งานรายการนี้ใช่ไหม?'))return;document.body.classList.add('loading');try{catalog=await api('masterSetActive',{entity:current,rowNumber,active:next});renderRows();setStatus('อัปเดตสถานะแล้ว')}catch(e){alert(e.message)}finally{document.body.classList.remove('loading')}}
    $('#search').oninput=renderRows;$('#storeFilter').onchange=renderRows;$('#dataTypeFilter').onchange=renderRows;$('#mainCategoryFilter').onchange=()=>{renderCategoryFilterOptions();renderRows()};$('#subCategoryFilter').onchange=renderRows;$('#add').onclick=()=>openEditor(null);$('#close').onclick=closeEditor;$('#cancel').onclick=closeEditor;$('#editor').onclick=e=>{if(e.target===$('#editor'))closeEditor()};$('#form').onsubmit=save;document.querySelectorAll('[data-profile-tab]').forEach(b=>b.onclick=()=>showProfileTab(b.dataset.profileTab));renderEntities();load();
  </script>

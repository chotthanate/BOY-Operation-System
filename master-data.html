<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7faf8">
  <title>ข้อมูลกลาง | BOY Operation</title>
  <link rel="stylesheet" href="assets/css/boy-pin-login.css?v=20260915-1">
  <style>
    :root{--ink:#18352e;--muted:#6d7c77;--green:#108a6d;--green2:#0b735b;--soft:#eaf6f1;--line:#dce7e2;--paper:#fff;--danger:#bd463c;--bg:#f4f8f6}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:env(safe-area-inset-top) 18px calc(34px + env(safe-area-inset-bottom))}.topbar{position:sticky;top:0;z-index:10;background:rgba(244,248,246,.94);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.back{border:0;background:var(--paper);border-radius:14px;padding:11px 14px;color:var(--ink);font-weight:800}.title small{display:block;color:var(--green);font-size:.72rem;font-weight:900;letter-spacing:.08em}.title h1{font-size:1.28rem;margin:2px 0}.status{font-size:.78rem;color:var(--muted)}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;padding-top:18px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 12px 30px rgba(24,53,46,.05)}.entity-list{display:grid;gap:7px}.entity{border:0;border-radius:13px;background:transparent;text-align:left;padding:12px;color:var(--ink);font-weight:750}.entity.active{background:var(--soft);color:var(--green2)}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:12px}.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fbfdfc}.primary,.secondary,.danger{border:0;border-radius:14px;padding:12px 15px;font-weight:850}.primary{background:var(--green);color:#fff}.secondary{background:var(--soft);color:var(--green2)}.danger{background:#fff0ee;color:var(--danger)}.rows{display:grid;gap:9px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:15px}.row.inactive{opacity:.58}.row strong{display:block}.meta{font-size:.76rem;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-actions{display:flex;gap:6px}.row-actions button{padding:8px 10px;border-radius:10px}.empty{text-align:center;color:var(--muted);padding:34px 10px}.sheet{position:fixed;inset:0;z-index:30;background:rgba(12,30,25,.42);display:flex;align-items:flex-end;justify-content:center;padding-top:30px}.sheet.hidden{display:none}.dialog{background:var(--paper);width:min(760px,100%);max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px max(18px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));box-shadow:0 -20px 70px rgba(0,0,0,.16)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.dialog-head h2{margin:0}.close{border:0;width:42px;height:42px;border-radius:50%;background:var(--soft);font-size:1.3rem}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:.78rem;font-weight:800;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff;color:var(--ink)}.field textarea{min-height:78px;resize:vertical}.field.full{grid-column:1/-1}.check{display:flex;align-items:center;gap:9px;min-height:44px;border:1px solid var(--line);border-radius:13px;padding:10px 12px}.check input{width:20px;height:20px}.actions{position:sticky;bottom:0;background:linear-gradient(transparent,#fff 20%);display:flex;justify-content:flex-end;gap:9px;padding-top:24px;margin-top:8px}.loading{pointer-events:none;opacity:.55}@media(max-width:760px){.shell{padding-left:12px;padding-right:12px}.layout{grid-template-columns:1fr}.entity-panel{overflow:auto}.entity-list{display:flex;width:max-content}.entity{white-space:nowrap}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.status{display:none}.row{align-items:start}.row-actions{flex-direction:column}}
  </style>
  <style id="boyAuthPendingStyle">html{visibility:hidden}</style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><button class="back" type="button" onclick="location.href='tawana.html'">‹ ทาวน่า</button><div class="title"><small>BOY MASTER</small><h1 id="pageTitle">ข้อมูลกลาง</h1></div><span class="status" id="status">พร้อมใช้งาน</span></header>
    <main class="layout">
      <aside class="panel entity-panel"><nav class="entity-list" id="entityList"></nav></aside>
      <section class="panel"><div class="toolbar"><input class="search" id="search" type="search" placeholder="ค้นหา" autocomplete="off"><button class="primary" id="add" type="button">+ เพิ่ม</button></div><div class="rows" id="rows"><div class="empty">กำลังโหลดข้อมูล…</div></div></section>
    </main>
  </div>
  <div class="sheet hidden" id="editor" role="dialog" aria-modal="true"><section class="dialog"><div class="dialog-head"><div><small id="editorCode"></small><h2 id="editorTitle">เพิ่มข้อมูล</h2></div><button class="close" id="close" type="button" aria-label="ปิด">×</button></div><form id="form"><div class="form" id="fields"></div><div class="actions"><button class="secondary" type="button" id="cancel">ยกเลิก</button><button class="primary" type="submit">บันทึกลง BOY Master</button></div></form></section></div>
  <script>
    const WEB_APP_URL='https://script.google.com/macros/s/AKfycbzgShPP4BpUUvDSs53esvJLru3CFAe1tM4LqdXE9rUzENbBNBFY3lPPqjVw6fnhgEKmGw/exec';
    const ENTITIES=[['employees','พนักงาน'],['items','สินค้าและวัตถุดิบ'],['expenseItems','รายการค่าใช้จ่าย'],['units','หน่วย'],['suppliers','ผู้ขาย'],['branches','สาขา'],['categories','หมวดหมู่'],['itemUnits','หน่วยสินค้า'],['itemSuppliers','ผู้ขายสินค้า'],['branchItems','สินค้าประจำสาขา']];
    let current=new URLSearchParams(location.search).get('entity')||'employees',catalog={headers:[],rows:[],required:[]},editing=null,referenceCache={};
    const $=s=>document.querySelector(s); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(action,data={}){const res=await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});const json=await res.json();if(json.status==='error')throw new Error(json.message||'ทำรายการไม่สำเร็จ');return json}
    function setStatus(t){$('#status').textContent=t}
    function renderEntities(){$('#entityList').innerHTML=ENTITIES.map(([key,label])=>`<button class="entity ${key===current?'active':''}" data-key="${key}">${label}</button>`).join('');document.querySelectorAll('.entity').forEach(b=>b.onclick=()=>{current=b.dataset.key;history.replaceState(null,'','?entity='+current);load()})}
    function primaryText(row){const preferred=['ชื่อเล่น','ชื่อสินค้า','ชื่อรายการค่าใช้จ่าย','ชื่อหน่วย','ชื่อผู้ขาย','ชื่อสาขา','ชื่อประเภทย่อย'];for(const key of preferred)if(row[key])return row[key];return row[catalog.idHeader]||'ไม่ระบุชื่อ'}
    function active(row){return !('เปิดใช้งาน'in row)||![false,'FALSE','false',0,'0'].includes(row['เปิดใช้งาน'])}
    function renderRows(){const q=$('#search').value.trim().toLowerCase();const rows=(catalog.rows||[]).filter(r=>!q||Object.values(r).join(' ').toLowerCase().includes(q));$('#rows').innerHTML=rows.length?rows.map(r=>`<article class="row ${active(r)?'':'inactive'}"><div><strong>${esc(primaryText(r))}</strong><div class="meta">${esc(r[catalog.idHeader]||'')} · ${active(r)?'เปิดใช้งาน':'ปิดใช้งาน'}</div></div><div class="row-actions"><button class="secondary" data-edit="${r.__rowNumber}">แก้ไข</button>${'เปิดใช้งาน'in r?`<button class="danger" data-active="${r.__rowNumber}" data-next="${active(r)?'false':'true'}">${active(r)?'ปิด':'เปิด'}</button>`:''}</div></article>`).join(''):'<div class="empty">ไม่พบข้อมูล</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor((catalog.rows||[]).find(r=>String(r.__rowNumber)===b.dataset.edit)));document.querySelectorAll('[data-active]').forEach(b=>b.onclick=()=>setActive(b.dataset.active,b.dataset.next==='true'))}
    async function load(){renderEntities();$('#rows').innerHTML='<div class="empty">กำลังโหลดข้อมูล…</div>';setStatus('กำลังโหลด…');try{catalog=await api('masterCatalog',{entity:current});$('#pageTitle').textContent=catalog.title||'ข้อมูลกลาง';$('#search').placeholder='ค้นหา'+(catalog.title||'ข้อมูล');renderRows();setStatus('โหลดแล้ว '+catalog.rows.length+' รายการ')}catch(e){$('#rows').innerHTML='<div class="empty">โหลดไม่สำเร็จ<br>'+esc(e.message)+'</div>';setStatus('เกิดข้อผิดพลาด')}}
    function isBoolHeader(h){return h==='เปิดใช้งาน'||/^(ติดตาม|อนุญาต|เป็น|ใช้|ซื้อได้|เบิกได้|ขายได้)/.test(h)}
    function isLong(h){return /หมายเหตุ|ที่อยู่|รายละเอียด/.test(h)}
    function referenceEntity(h){if(h==='branch_id')return'branches';if(h==='item_id')return'items';if(h==='unit_id'||h==='base_unit_id')return'units';if(h==='supplier_id')return'suppliers';return''}
    async function referenceOptions(h,value){const entity=referenceEntity(h);if(!entity)return'';if(!referenceCache[entity])referenceCache[entity]=await api('masterCatalog',{entity});const ref=referenceCache[entity];return '<option value="">— เลือก —</option>'+ref.rows.filter(active).map(r=>{const id=r[ref.idHeader]||'';return `<option value="${esc(id)}" ${String(id)===String(value)?'selected':''}>${esc(primaryReferenceText(r,entity))} (${esc(id)})</option>`}).join('')}
    function primaryReferenceText(r,entity){const keys={branches:['ชื่อสาขา'],items:['ชื่อสินค้า'],units:['ชื่อหน่วย'],suppliers:['ชื่อผู้ขาย']}[entity]||[];return keys.map(k=>r[k]).find(Boolean)||r[Object.keys(r).find(k=>/_id$/.test(k))]||'รายการ'}
    async function openEditor(row){editing=row||null;$('#editorTitle').textContent=(row?'แก้ไข':'เพิ่ม')+(catalog.title||'ข้อมูล');$('#editorCode').textContent=row?(row[catalog.idHeader]||''):'ระบบจะสร้างรหัสให้อัตโนมัติ';$('#fields').innerHTML='<div class="empty full">กำลังเตรียมแบบฟอร์ม…</div>';$('#editor').classList.remove('hidden');const chunks=[];for(const h of catalog.headers){const value=row?.[h]??'';const required=(catalog.required||[]).includes(h);if(h===catalog.idHeader){chunks.push(`<div class="field full"><label>${esc(h)}</label><input name="${esc(h)}" value="${esc(value)}" readonly placeholder="สร้างอัตโนมัติ"></div>`);continue}if(isBoolHeader(h)){const checked=row?activeValue(value):h==='เปิดใช้งาน';chunks.push(`<label class="check"><input type="checkbox" name="${esc(h)}" ${checked?'checked':''}><span>${esc(h)}</span></label>`);continue}const options=await referenceOptions(h,value);if(options){chunks.push(`<div class="field"><label>${esc(h)}${required?' *':''}</label><select name="${esc(h)}" ${required?'required':''}>${options}</select></div>`);continue}if(isLong(h)){chunks.push(`<div class="field full"><label>${esc(h)}</label><textarea name="${esc(h)}" ${required?'required':''}>${esc(value)}</textarea></div>`);continue}const type=/วันที่|วันเดือนปีเกิด/.test(h)?'date':/^เวลา/.test(h)?'time':/จำนวน|ราคา|ค่าแรง|ชั่วโมง|อัตรา|ขั้นต่ำ|จุดสั่ง/.test(h)?'number':'text';chunks.push(`<div class="field"><label>${esc(h)}${required?' *':''}</label><input type="${type}" ${type==='number'?'step="any"':''} name="${esc(h)}" value="${esc(formatValue(value,type))}" ${required?'required':''}></div>`)}$('#fields').innerHTML=chunks.join('')}
    function activeValue(v){return ![false,'FALSE','false',0,'0',''].includes(v)}
    function formatValue(v,type){if(!v)return'';if(type==='date'){const d=new Date(v);return isNaN(d)?String(v).slice(0,10):d.toISOString().slice(0,10)}if(type==='time'){const text=String(v);const match=text.match(/(?:T|\s)(\d{2}:\d{2})/);return match?match[1]:text.slice(0,5)}return v}
    function closeEditor(){$('#editor').classList.add('hidden');editing=null}
    async function save(e){e.preventDefault();const values={};new FormData(e.target).forEach((v,k)=>values[k]=v);catalog.headers.filter(isBoolHeader).forEach(h=>values[h]=Boolean(e.target.elements[h]?.checked));document.body.classList.add('loading');setStatus('กำลังบันทึก…');try{catalog=await api('masterSave',{entity:current,rowNumber:editing?.__rowNumber||'',values});closeEditor();renderRows();setStatus('บันทึกลง BOY Master แล้ว')}catch(err){alert('บันทึกไม่สำเร็จ: '+err.message);setStatus('บันทึกไม่สำเร็จ')}finally{document.body.classList.remove('loading')}}
    async function setActive(rowNumber,next){if(!confirm((next?'เปิด':'ปิด')+'ใช้งานรายการนี้ใช่ไหม?'))return;document.body.classList.add('loading');try{catalog=await api('masterSetActive',{entity:current,rowNumber,active:next});renderRows();setStatus('อัปเดตสถานะแล้ว')}catch(e){alert(e.message)}finally{document.body.classList.remove('loading')}}
    $('#search').oninput=renderRows;$('#add').onclick=()=>openEditor(null);$('#close').onclick=closeEditor;$('#cancel').onclick=closeEditor;$('#editor').onclick=e=>{if(e.target===$('#editor'))closeEditor()};$('#form').onsubmit=save;renderEntities();load();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/boy-central-config.js"></script>
  <script src="assets/js/boy-local-access.js?v=20260915-1"></script>
  <script src="assets/js/boy-auth-guard.js"></script>
</body>
</html>

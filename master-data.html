    async function confirmImport(){if(!pendingImport.length)return;document.body.classList.add('loading');setStatus('กำลังนำเข้า…');try{catalog=await api('sheetBulkSave',{sheetName:currentSheetName(),rows:pendingImport,actor:actor()});const result=catalog.imported||{};pendingImport=[];$('#importDialog').classList.add('hidden');renderRows();setStatus(`นำเข้าแล้ว เพิ่ม ${result.added||0} แก้ไข ${result.updated||0}`)}catch(error){alert('นำเข้าไม่สำเร็จ: '+error.message);setStatus('นำเข้าไม่สำเร็จ')}finally{document.body.classList.remove('loading')}}
    async function openHistory(){const dialog=$('#historyDialog'),list=$('#historyList');dialog.classList.remove('hidden');list.innerHTML='<div class="empty">กำลังโหลด…</div>';try{const data=await api('masterHistory',{sheetName:currentSheetName(),limit:60});list.innerHTML=data.rows.length?data.rows.map(row=>`<article class="audit-row"><div><strong>${esc(row.action)}${row.record_key?' · '+esc(row.record_key):''}</strong><small>${esc(row.changed_at)} · ${esc(row.actor)}</small></div>${!row.undone_at&&row.action!=='ย้อนกลับ'?`<button class="secondary" data-undo="${esc(row.audit_id)}">ย้อนกลับ</button>`:'<span class="meta">ย้อนแล้ว</span>'}</article>`).join(''):'<div class="empty">ยังไม่มีประวัติแก้ไข</div>';list.querySelectorAll('[data-undo]').forEach(button=>button.onclick=()=>undoAudit(button.dataset.undo))}catch(error){list.innerHTML=`<div class="empty">${esc(error.message)}</div>`}}
    async function undoAudit(auditId){if(!confirm('ย้อนกลับเป็นค่าก่อนแก้ไขใช่ไหม?'))return;try{await api('masterUndo',{auditId,actor:actor()});$('#historyDialog').classList.add('hidden');await load();setStatus('ย้อนกลับข้อมูลแล้ว')}catch(error){alert(error.message)}}
    async function openHealth(){const dialog=$('#healthDialog'),list=$('#healthList');dialog.classList.remove('hidden');list.innerHTML='<div class="empty">กำลังตรวจ…</div>';try{const data=await api('systemHealthCheck');const rows=[{name:'การเชื่อมต่ออินเทอร์เน็ต',ok:navigator.onLine,message:navigator.onLine?'ออนไลน์':'ออฟไลน์'},{name:'Google Sheet และ Apps Script',ok:data.ok,message:data.ok?'พร้อมใช้งาน':'พบตารางที่ต้องตรวจ'},{name:'ข้อมูลกลาง BOY',ok:true,message:`เปิดใช้งาน ${ENTITIES.length} หน้า`}];if(window.supabase&&window.BOY_CENTRAL_CONFIG){const client=window.supabase.createClient(window.BOY_CENTRAL_CONFIG.url,window.BOY_CENTRAL_CONFIG.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const session=await client.auth.getSession();if(session.data.session){const devices=await client.schema('boy_central').from('pos_devices').select('device_name,status,last_sync_at,app_version').order('device_name');if(!devices.error)(devices.data||[]).forEach(device=>rows.push({name:device.device_name,ok:device.status==='active',message:`POS ${device.status==='active'?'เชื่อมต่อ':'ยังไม่พร้อม'}${device.last_sync_at?' · ซิงก์ '+new Date(device.last_sync_at).toLocaleString('th-TH'):''}${device.app_version?' · v'+device.app_version:''}`}))}}list.innerHTML=rows.map(row=>`<article class="health-row"><div><strong>${esc(row.name)}</strong><small>${esc(row.message)}</small></div><span class="${row.ok?'health-ok':'health-bad'}">${row.ok?'พร้อม':'ตรวจสอบ'}</span></article>`).join('')+data.masterTables.filter(item=>!item.ok).map(item=>`<article class="health-row"><div><strong>${esc(item.name)}</strong><small>${esc(item.message)}</small></div><span class="health-bad">ตรวจสอบ</span></article>`).join('')}catch(error){list.innerHTML=`<div class="empty">ตรวจไม่สำเร็จ<br>${esc(error.message)}</div>`}}
    $('#search').oninput=()=>{currentPage=1;renderRows()};$('#entitySearch').oninput=renderEntities;$('#dataTypeFilter').onchange=()=>{currentPage=1;renderRows()};$('#mainCategoryFilter').onchange=()=>{currentPage=1;renderCategoryFilterOptions();renderRows()};$('#subCategoryFilter').onchange=()=>{currentPage=1;renderRows()};$('#prevPage').onclick=()=>{currentPage--;renderRows();scrollTo({top:0,behavior:'smooth'})};$('#nextPage').onclick=()=>{currentPage++;renderRows();scrollTo({top:0,behavior:'smooth'})};$('#add').onclick=()=>openEditor(null);$('#close').onclick=closeEditor;$('#cancel').onclick=closeEditor;$('#editor').onclick=e=>{if(e.target===$('#editor'))closeEditor()};$('#form').onsubmit=save;$('#exportButton').onclick=exportCsv;$('#importButton').onclick=()=>$('#importFile').click();$('#importFile').onchange=event=>{const file=event.target.files[0];event.target.value='';if(file)prepareImport(file).catch(error=>alert(error.message))};$('#confirmImport').onclick=confirmImport;$('#historyButton').onclick=openHistory;$('#healthButton').onclick=openHealth;document.querySelectorAll('[data-close-dialog]').forEach(button=>button.onclick=()=>$('#'+button.dataset.closeDialog).classList.add('hidden'));document.querySelectorAll('.tool-dialog').forEach(dialog=>dialog.onclick=event=>{if(event.target===dialog)dialog.classList.add('hidden')});document.querySelectorAll('[data-profile-tab]').forEach(b=>b.onclick=()=>showProfileTab(b.dataset.profileTab));if(!ENTITIES.some(item=>item[0]===current))current='employees';if(!STORE_TYPES.some(([key])=>key===selectedStore))selectedStore='';renderStoreFilter();let started=false;function startMasterData(){if(started)return;started=true;renderEntities();load()}window.addEventListener('boy-auth-ready',startMasterData);if(window.BOY_AUTH_CONTEXT)startMasterData();
  </script>
